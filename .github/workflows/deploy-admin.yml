name: Deploy admin to NAS

on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "package.json"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    environment:
      name: Production - sao-blog-admin
      url: https://blog-admin.sao-x.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build docker image
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BLOG_URL: ${{ vars.VITE_BLOG_URL }}
        run: |
          docker build \
            --build-arg "VITE_API_URL=${VITE_API_URL:-https://blog-api.sao-x.com}" \
            --build-arg "VITE_BLOG_URL=${VITE_BLOG_URL:-https://blog.sao-x.com}" \
            -t sao-blog-admin:latest \
            -f apps/admin/Dockerfile .

      - name: Save image to tar
        run: docker save sao-blog-admin:latest -o sao-blog-admin.tar

      - name: Prepare non-interactive SSH password helper
        env:
          SSH_PASS: ${{ secrets.NAS_PASSWORD }}
        run: |
          ASKPASS=$(mktemp)
          cat > "$ASKPASS" << 'EOF'
          #!/bin/sh
          echo "$SSH_PASS"
          EOF
          chmod +x "$ASKPASS"
          echo "SSH_ASKPASS=$ASKPASS" >> "$GITHUB_ENV"
          echo "SSH_ASKPASS_REQUIRE=force" >> "$GITHUB_ENV"

      - name: Copy image to NAS
        env:
          SSH_PASS: ${{ secrets.NAS_PASSWORD }}
        run: |
          scp -O -P ${{ secrets.NAS_PORT }} -o StrictHostKeyChecking=no \
            sao-blog-admin.tar \
            ${{ secrets.NAS_USERNAME }}@${{ secrets.NAS_HOST }}:/volume1/docker/blog-server/

      - name: Load image and restart admin on NAS
        env:
          SSH_PASS: ${{ secrets.NAS_PASSWORD }}
        run: |
          ssh -p ${{ secrets.NAS_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.NAS_USERNAME }}@${{ secrets.NAS_HOST }} '
              export PATH=$PATH:/usr/local/bin &&
              cd /volume1/docker/blog-server &&
              docker load -i sao-blog-admin.tar &&
              docker network inspect sao-blog-network >/dev/null 2>&1 ||
                docker network create sao-blog-network &&
              docker rm -f sao-blog-admin >/dev/null 2>&1 || true &&
              docker run -d \
                --name sao-blog-admin \
                --restart unless-stopped \
                --network sao-blog-network \
                --env-file apps/admin/.env \
                -p 3003:80 \
                sao-blog-admin:latest &&
              rm -f sao-blog-admin.tar &&
              docker image prune -f
            '

      - name: Remove SSH password helper
        if: always()
        run: rm -f "$SSH_ASKPASS"

      - name: Cleanup runner workspace
        if: always()
        run: rm -f sao-blog-admin.tar

      - name: Prune unused images/containers and cap build cache size
        if: always()
        run: |
          docker container prune -f
          docker image prune -f
          docker builder prune -f --max-used-space 3GB
