name: Deploy tan-blog to NAS

on:
  push:
    branches: [main]
    paths:
      - "apps/tan-blog/**"
      - "packages/**"
      - "docker-compose.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "package.json"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    environment:
      name: Production - sao-blog-tan-blog
      url: https://blog.sao-x.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build docker image
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
        run: |
          docker build \
            --build-arg "VITE_SERVER_URL=${VITE_SERVER_URL:-https://blog-api.sao-x.com}" \
            --build-arg "VITE_WS_URL=${VITE_WS_URL:-wss://blog-api.sao-x.com}" \
            --build-arg "VITE_SITE_URL=${VITE_SITE_URL:-https://blog.sao-x.com}" \
            -t sao-blog-tan-blog:latest \
            -f apps/tan-blog/Dockerfile .

      - name: Save image to tar
        run: docker save sao-blog-tan-blog:latest -o sao-blog-tan-blog.tar

      - name: Prepare non-interactive SSH password helper
        env:
          SSH_PASS: ${{ secrets.NAS_PASSWORD }}
        run: |
          ASKPASS=$(mktemp)
          cat > "$ASKPASS" << 'EOF'
          #!/bin/sh
          echo "$SSH_PASS"
          EOF
          chmod +x "$ASKPASS"
          echo "SSH_ASKPASS=$ASKPASS" >> "$GITHUB_ENV"
          echo "SSH_ASKPASS_REQUIRE=force" >> "$GITHUB_ENV"

      - name: Copy image + compose file to NAS
        env:
          SSH_PASS: ${{ secrets.NAS_PASSWORD }}
        run: |
          scp -O -P ${{ secrets.NAS_PORT }} -o StrictHostKeyChecking=no \
            sao-blog-tan-blog.tar \
            ${{ secrets.NAS_USERNAME }}@${{ secrets.NAS_HOST }}:/volume1/docker/blog-server/

      - name: Load image and restart tan-blog on NAS
        env:
          SSH_PASS: ${{ secrets.NAS_PASSWORD }}
        run: |
          ssh -p ${{ secrets.NAS_PORT }} -o StrictHostKeyChecking=no \
            ${{ secrets.NAS_USERNAME }}@${{ secrets.NAS_HOST }} '
              export PATH=$PATH:/usr/local/bin &&
              cd /volume1/docker/blog-server &&
              docker load -i sao-blog-tan-blog.tar &&
              docker network inspect sao-blog-network >/dev/null 2>&1 ||
                docker network create sao-blog-network &&
              docker rm -f sao-blog-tan-blog >/dev/null 2>&1 || true &&
              docker run -d \
                --name sao-blog-tan-blog \
                --restart unless-stopped \
                --network sao-blog-network \
                --env-file apps/tan-blog/.env.local \
                -p 3004:3000 \
                sao-blog-tan-blog:latest &&
              rm -f sao-blog-tan-blog.tar &&
              docker image prune -f
            '

      - name: Remove SSH password helper
        if: always()
        run: rm -f "$SSH_ASKPASS"

      - name: Cleanup runner workspace
        if: always()
        run: rm -f sao-blog-tan-blog.tar

      - name: Prune unused images/containers and cap build cache size
        if: always()
        run: |
          docker container prune -f
          docker image prune -f
          docker builder prune -f --max-used-space 3GB
